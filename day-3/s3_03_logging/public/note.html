<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Une note · Laboratoire logging</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><nav>Formation › Jour 3 › Section 3 › Logging</nav></header>
  <main class="shell">
    <section class="workspace note-page">
      <a class="back-link" href="/dashboard/">← Revenir au tableau de bord</a>
      <p class="eyebrow">03.03 · Consultation auditée</p>
      <article id="note-card" class="note-detail" hidden>
        <p class="note-id">Note <span id="note-id"></span></p>
        <h1 id="note-title"></h1>
        <p id="note-content" class="note-content"></p>
      </article>
      <div id="note-error" class="error-card" aria-live="polite">Chargement de la note…</div>
    </section>
    <aside>
      <p class="eyebrow">Trace produite</p>
      <p>L’ouverture de cette note ajoute un événement <code>NOTE_READ</code> au journal choisi lors de la connexion.</p>
      <code id="log-file" class="file-path"></code>
      <p id="mode-explanation"></p>
    </aside>
  </main>
  <script src="/note.js" defer></script>
</body>
</html>
